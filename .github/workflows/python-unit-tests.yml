name: Unit Tests

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python # Set Python version
        uses: actions/setup-python@v5
        with:
          python-version: 3.13
      
      - name: Install requirements
        run: |
          pip install -r requirements.txt
          pip install coverage

      - name: Test with pytest
        run: |
          coverage run -m unittest discover -s "./tests/unit"
          
      - name: Write coverage report
        run: |
          # mkdir -p output/test/
          # touch output/test/.coverage-report.txt
          coverage report -m > output/test/coverage-report.txt
          # The XML is not particularly useful right now
          # coverage xml -o output/test/coverage-report.xml
          cat output/test/coverage-report.txt

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-xml
          path: output/test/coverage-report.txt
